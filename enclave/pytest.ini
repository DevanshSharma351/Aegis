[pytest]
testpaths = tests
# The enclave imports its own modules flat (main, attestation, quant.*) and the
# shared measurement package as `aegis_tdx`. In the container both sit at /app;
# from a checkout, aegis_tdx lives in shared/pylib. Both paths are added so the
# suite runs identically in either place.
pythonpath = . ../shared/pylib
addopts = -q --strict-markers
