# Add this to the root docker-compose.yml services block

  railgun-sidecar:
    build:
      context: ./railgun-sidecar
    environment:
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - RAILGUN_WALLET_MNEMONIC=${RAILGUN_WALLET_MNEMONIC}
    networks:
      - aegis-internal
    # No `ports:` mapping here!
    # ISOLATION REQUIREMENT: This sidecar must ONLY be accessible to the Enclave service
    # running on the same `aegis-internal` network. Exposing it to 0.0.0.0 on the host
    # compromises the security of the private wallet.

# Ensure networks block exists in root docker-compose.yml
# networks:
#   aegis-internal:
#     internal: true
